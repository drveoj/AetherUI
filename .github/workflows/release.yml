# Build a zip and attach it to a GitHub release. BY HAND, ON PURPOSE.
#
# MANUAL ONLY. This used to fire on every `v*` tag, which sounds right and is
# not: a tag gets cut on every bump, and bumps happen several times an afternoon
# while something is being fixed. That produced eleven releases in a day, none of
# which was one - and they all had to be deleted before 1.0 could be the first.
#
# A release is a decision. This is where you make it: Actions -> Release -> Run
# workflow, and pick the TAG in the ref dropdown rather than a branch. The
# packager reads the version out of whatever it finds at that ref, and a tagged
# HEAD is what tells it this is a release rather than an alpha.
#
# So the sequence is still `bump.py`, commit, tag, push - and then, when you
# actually mean it, press the button.
#
# THE UPLOAD IS OPT-IN. BigWigsMods/packager publishes to CurseForge,
# WoWInterface and Wago when it finds a token for each, and does not when it does
# not - so today this builds the zip and attaches it to a GitHub release and
# sends nothing anywhere else. It starts publishing the day a CF_API_KEY secret
# is added, which also wants `## X-Curse-Project-ID` in the .toc.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads the changelog out of the git history, so a
          # shallow clone gives it one commit to describe a release with.
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@master
        with:
          # -l SKIPS @localization@ KEYWORD REPLACEMENT, and it has to.
          #
          # That step calls wow.curseforge.com/api/projects/<id>/localization/
          # export, which is the LEGACY author-portal API and wants the legacy
          # per-project token. CF_API_KEY is the modern upload token from
          # authors.curseforge.com - a different credential entirely - so the
          # export answers "API token is malformed" and takes the whole build
          # down with it, twice, before the upload is even attempted. Project
          # approval made no difference because approval was never the problem.
          #
          # Nothing is lost. There are no translations: every Locale/*.lua but
          # enUS holds one @localization@ comment and nothing else, and an
          # unsubstituted comment is exactly what ships today. When there ARE
          # translations, this flag comes off and the legacy token goes in.
          args: -l
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
